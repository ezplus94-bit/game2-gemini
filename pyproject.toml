[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dominion"
version = "0.11.0"
description = "A modular, testable Dominion engine with a text-mode prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi", "uvicorn[standard]"]
dev = ["pytest>=7", "fastapi", "uvicorn[standard]"]

[project.scripts]
dominion = "dominion.ui.cli:main"
dominion-web = "dominion.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dominion.web" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
